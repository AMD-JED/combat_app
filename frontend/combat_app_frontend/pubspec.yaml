name: combat_app_frontend
description: "Combat Sports Network — Flutter Frontend (v1: Auth + Profile)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3+1
  http_parser: ^4.1.2

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Avatar picking & upload
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Cached network images (avatars, etc.)
  cached_network_image: ^3.3.1

  # Real-time messaging (WebSocket)
  web_socket_channel: ^2.4.0

  # Font used across the Athletes Hub design — one family covering both
  # Arabic and Latin scripts so ar/fr/en all render consistently.
  google_fonts: ^6.2.1

  # Localization (AR/FR/EN — user-selectable in Settings, see l10n.yaml)
  flutter_localizations:
    sdk: flutter
  intl: any

  # Persisted user preferences (theme mode, language)
  shared_preferences: ^2.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
