name: combat_app_frontend
description: "Combat Sports Network — Flutter Frontend (v1: Auth + Profile)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3+1

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Avatar picking & upload
  image_picker: ^1.1.2

  # Cached network images (avatars, etc.)
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
